name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Info ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set!"
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VER_OUTPUT"

          # Extract major version number (handles "17.0.x", "21.0.x", etc.)
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect Java major version from '$JAVA_VER_OUTPUT'"
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version must be 17 or higher. Detected: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully (Major version: $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in workspace."
          else
            echo "Generating temporary debug.keystore with Java keytool..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create or find ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Inspecting app/build/outputs/apk directory:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -ls
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::File does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          echo "Verified APK at $EXPECTED_APK (Size: $(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ]; then
            echo "::error::Source APK missing at $SRC_APK"
            exit 1
          fi

          ASSET_DIR="$RUNNER_TEMP/release_asset_dir"
          mkdir -p "$ASSET_DIR"

          # Sanitize repository name (e.g. owner/my-repo -> my-repo)
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -cd 'a-zA-Z0-9._-')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_APK="$ASSET_DIR/$ASSET_FILENAME"

          cp "$SRC_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK"
            exit 1
          fi

          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_APK"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is invalid or missing: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset does not have .apk extension: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### 📱 Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run:** #${GITHUB_RUN_NUMBER}
          - **Run Attempt:** #${GITHUB_RUN_ATTEMPT}
          - **Commit SHA:** \`${GITHUB_SHA}\`
          - **Asset:** \`${ASSET_NAME}\`

          > **Note:** This APK is intended for testing purposes only. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "Release created successfully."
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "========================================================"
            echo " GitHub Release Succeeded!"
            echo "========================================================"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "APK Asset Filename: $ASSET_NAME"
            
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Direct Release URL: $RELEASE_URL"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK has been built and published directly to GitHub Releases."
              echo ""
              echo "- 📦 **Direct Download:** [View GitHub Release & Download APK]($RELEASE_URL)"
              echo "- 🏷️ **Release Tag:** \`$RELEASE_TAG\`"
              echo "- 📄 **Asset Name:** \`$ASSET_NAME\`"
              echo ""
              echo "The standard GitHub Actions artifact **\`app-debug-apk\`** is also available on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "========================================================"
            echo "⚠️ GitHub Release Publishing Was Not Successful"
            echo "========================================================"
            echo "The APK build and Actions artifact upload succeeded."
            echo "Artifact 'app-debug-apk' is preserved and available for download."

            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Warning)"
              echo ""
              echo "The debug APK was built and uploaded as a GitHub Actions artifact successfully."
              echo "However, publishing directly to GitHub Releases encountered an issue or was skipped."
              echo ""
              echo "- 📦 **Download Backup:** Download the **\`app-debug-apk\`** artifact from the Artifacts section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
